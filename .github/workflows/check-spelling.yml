name: Spellcheck Action

on:
  push:
    paths:
    - '**.md'
    - '.github/workflows/check-spelling.yml'
    - '.github/spellcheck.yml'
    - '.github/spellchecker-wordlist.txt'

permissions: read-all

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Spellcheck
      uses: rojopolis/spellcheck-github-actions@f2df388397bcb35f524b4a0a3567d6b1e8a4e595 # 0.68.0
      with:
        config_path: .github/spellcheck.yml # put path to configuration file here
