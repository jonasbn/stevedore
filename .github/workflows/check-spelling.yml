name: Spellcheck Action

on:
  push:
    paths:
    - '**.md'
    - '.github/workflows/check-spelling.yml'
    - '.github/spellcheck.yml'
    - '.github/spellchecker-wordlist.txt'

permissions: read-all

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Spellcheck
      uses: rojopolis/spellcheck-github-actions@dad57fc333130f4c9ae9632a6ad7ddc4de3515a2 # 0.69.0
      with:
        config_path: .github/spellcheck.yml # put path to configuration file here
